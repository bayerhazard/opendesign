olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
workloadReplicas:
  opendesign: 1
metadata:
  name: opendesign
  appid: opendesign
  description: Open-source Claude Design alternative — local-first design studio
  icon: https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fopen-design.ai%2Ffavicon.png&f=1&nofb=1&ipt=00000000000000000000000000000000
  title: Open Design
  version: 26.08.11
  categories:
    - Utilities
permission:
  appData: true
spec:
  versionName: "0.19.1"
  fullDescription: |
    Open Design is the open-source alternative to Claude Design. It turns any
    coding agent (Claude Code, Codex, OpenCode, DeepSeek Harness, ...) into a
    design engine: prototypes, landing pages, dashboards, decks, images and
    video — as real files with HTML / PDF / PPTX / MP4 export.

    - Local-first design studio with brand-grade DESIGN.md design systems
    - BYOK at every layer: any OpenAI-compatible endpoint or CLI agent
    - HyperFrames HTML → MP4 motion graphics
    - Sandboxed iframe preview, live dashboards and artifacts

  upgradeDescription: |
    v26.08.11: Configurable origins — OD_PUBLIC_BASE_URL / OD_ALLOWED_ORIGINS now come from app env (defaults to the primary entrance), so a custom route domain (e.g. design.aimighty.olares.de) works.
    v26.08.10: Env-configurable LLM gateway — opencode base URL + API key now come from app env (LLM_BASE_URL / LLM_API_KEY), no hardcoded credential in the chart.
    v26.08.1: Initial release. Built for Olares 1.12.6.

  developer: nexu-io
  website: https://open-design.ai
  sourceCode: https://github.com/nexu-io/open-design
  submitter: aimighty
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: 100m
  limitedCpu: "2"
  requiredMemory: 128Mi
  limitedMemory: 2Gi
  requiredDisk: 500Mi
entrances:
  - name: opendesign
    port: 80
    host: opendesign-svc
    title: Open Design
    openMethod: window
    authLevel: internal
envs:
  - envName: LLM_BASE_URL
    default: "https://llm.aimighty.olares.de/v1"
    type: url
    editable: true
    applyOnChange: true
    description: "OpenAI-compatible base URL of the model gateway that opencode (Local CLI mode) uses."
  - envName: LLM_API_KEY
    default: ""
    type: password
    editable: true
    applyOnChange: true
    description: "API key for LLM_BASE_URL."
  - envName: OD_PUBLIC_BASE_URL
    default: ""
    type: url
    editable: true
    applyOnChange: true
    description: "Public base URL the app advertises for generated links (defaults to the primary entrance)."
  - envName: OD_ALLOWED_ORIGINS
    default: ""
    type: string
    editable: true
    applyOnChange: true
    description: "Extra browser origins (comma-separated full URLs) the app accepts, e.g. a custom route such as https://design.aimighty.olares.de (the primary entrance is always allowed)."
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.6-0'